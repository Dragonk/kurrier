# Testing-only deployment. Do not point this stack at production data.
# Copy .env.example to .env and replace every placeholder before starting.
# Browser traffic must come through Zoraxy's existing Docker network.

services:
  kurrier-web:
    image: ghcr.io/dragonk/kurrier-web:${KURRIER_IMAGE_TAG:-pr-616}
    restart: unless-stopped
    env_file: .env
    environment:
      # Next.js standalone reads HOSTNAME (not HOST); bind outside the container
      # so Zoraxy can reach this service through proxy-network.
      HOSTNAME: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_started
      worker:
        condition: service_started
    networks:
      - internal
      - zoraxy_proxy

  worker:
    image: ghcr.io/dragonk/kurrier-worker:${KURRIER_IMAGE_TAG:-pr-616}
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_started
      dav:
        condition: service_started
    networks:
      - internal

  postgres:
    image: ghcr.io/dragonk/kurrier-bootstrap:${KURRIER_IMAGE_TAG:-pr-616}
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - ${KURRIER_DATA_DIR:-/mnt/Dane/kurrier}/postgres:/var/lib/postgresql
    networks:
      - internal

  migrate:
    image: ghcr.io/dragonk/kurrier-bootstrap:${KURRIER_IMAGE_TAG:-pr-616}
    profiles: ["bootstrap"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    entrypoint: ["/bootstrap/db-bootstrap.sh"]
    restart: "no"
    networks:
      - internal

  redis:
    image: redis:8.2.2
    restart: unless-stopped
    env_file: .env
    command: ["redis-server", "--appendonly", "yes", "--stop-writes-on-bgsave-error", "no", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" PING']
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - ${KURRIER_DATA_DIR:-/mnt/Dane/kurrier}/redis:/data
    networks:
      - internal

  typesense:
    image: typesense/typesense:29.0
    restart: unless-stopped
    env_file: .env
    command: >-
      --data-dir /data
      --api-key=${TYPESENSE_API_KEY}
      --enable-cors
    volumes:
      - ${KURRIER_DATA_DIR:-/mnt/Dane/kurrier}/typesense:/data
    networks:
      - internal

  garage:
    image: ghcr.io/dragonk/kurrier-garage:${KURRIER_IMAGE_TAG:-pr-616}
    restart: unless-stopped
    env_file: .env
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET}
    command: /garage server --single-node --default-bucket
    volumes:
      - ${KURRIER_DATA_DIR:-/mnt/Dane/kurrier}/garage/data:/var/lib/garage/data
      - ${KURRIER_DATA_DIR:-/mnt/Dane/kurrier}/garage/meta:/var/lib/garage/meta
    networks:
      - internal

  baikal-postgres:
    image: ghcr.io/dragonk/kurrier-baikal-postgres:${KURRIER_IMAGE_TAG:-pr-616}
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${DAV_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DAV_POSTGRES_PASSWORD}
      POSTGRES_DB: ${DAV_POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - ${KURRIER_DATA_DIR:-/mnt/Dane/kurrier}/baikal-postgres:/var/lib/postgresql
    networks:
      - internal

  dav:
    image: ghcr.io/dragonk/kurrier-baikal:${KURRIER_IMAGE_TAG:-pr-616}
    restart: unless-stopped
    env_file: .env
    depends_on:
      baikal-postgres:
        condition: service_healthy
    environment:
      DAV_POSTGRES_USER: ${DAV_POSTGRES_USER}
      DAV_POSTGRES_PASSWORD: ${DAV_POSTGRES_PASSWORD}
      DAV_POSTGRES_DB: ${DAV_POSTGRES_DB}
      DAV_CONFIG_ENCRYPTION_KEY: ${DAV_CONFIG_ENCRYPTION_KEY}
      DAV_ADMIN_PASSWORD_HASH: ${DAV_ADMIN_PASSWORD_HASH}
    volumes:
      - ${KURRIER_DATA_DIR:-/mnt/Dane/kurrier}/dav/config:/var/www/baikal/config
      - ${KURRIER_DATA_DIR:-/mnt/Dane/kurrier}/dav/data:/var/www/baikal/Specific
    networks:
      - internal

networks:
  internal:
    name: kurrier-internal
  zoraxy_proxy:
    external: true
    name: ${ZORAXY_PROXY_NETWORK:?Set ZORAXY_PROXY_NETWORK to Zoraxy's existing Docker network}
