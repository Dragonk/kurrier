name: pr-test-images

on:
  push:
    branches:
      - fix/i18n-locale-validation
  workflow_dispatch:

concurrency:
  group: pr-test-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and publish ${{ matrix.service }} test image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [web, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/dragonk/kurrier-${{ matrix.service }}:pr-616
            ghcr.io/dragonk/kurrier-${{ matrix.service }}:sha-${{ github.sha }}
          build-args: |
            WEB_URL=http://localhost:3000
            WORKER_URL=http://worker
            DAV_URL=http://dav
            JWT_SECRET=build-only-placeholder
            APP_SECRET_ENCRYPTION_KEY=build-only-placeholder
            S3_REGION=garage
            S3_BUCKET=build-bucket
            S3_ENDPOINT=http://garage:3900
            S3_ACCESS_KEY=build-access-key
            S3_SECRET_KEY=build-secret-key
            S3_FORCE_PATH_STYLE=true
          provenance: true
          sbom: true
